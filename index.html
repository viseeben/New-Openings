<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Shop Openings</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
:root{
  --bg:#faf8f5;--panel:#fff;--ink:#1f1a17;--muted:#6f655e;--line:#e7e1da;
  --accent:#8a4b20;--accent-ink:#fff;--chip:#f1ebe4;--new:#1f7a4d;--new-bg:#e3f4ea;
  --hot:#b8461b;--warm:#c9852c;--cool:#8c8580;--row-hover:#f6f1ec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171412;--panel:#1f1b18;--ink:#efe9e3;--muted:#a59a91;--line:#342e29;
  --accent:#d4894f;--accent-ink:#1a120c;--chip:#2b2521;--new:#6fd3a0;--new-bg:#183326;
  --hot:#f08a5d;--warm:#e3b25e;--cool:#8f8780;--row-hover:#26211d;}}
:root[data-theme="dark"]{
  --bg:#171412;--panel:#1f1b18;--ink:#efe9e3;--muted:#a59a91;--line:#342e29;
  --accent:#d4894f;--accent-ink:#1a120c;--chip:#2b2521;--new:#6fd3a0;--new-bg:#183326;
  --hot:#f08a5d;--warm:#e3b25e;--cool:#8f8780;--row-hover:#26211d;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{padding:20px 16px 8px;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.controls-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
input[type=search]{flex:1 1 220px;min-width:0}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
label.chk{display:flex;gap:5px;align-items:center;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
main{max-width:1400px;margin:0 auto;padding:8px 16px 40px}
.count{color:var(--muted);margin:6px 0 8px;font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;background:var(--panel)}
th.sorted{color:var(--ink)}
th .arr{opacity:.6;margin-left:3px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--row-hover)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.score{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.name{font-weight:600}
.alt{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:1px;font-weight:600}
.b-new{background:var(--new-bg);color:var(--new)}
.b-chain{background:var(--chip);color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:0 6px;margin:1px 3px 1px 0;font-size:12px;white-space:nowrap}
.st{font-size:12px;padding:3px 6px}
.contact{font-size:12px;line-height:1.5}
.contact .who{color:var(--ink);font-weight:500}
.contact a{text-decoration:none;white-space:nowrap;margin-right:7px}
.contact a:hover{text-decoration:underline}
.conf{color:var(--muted);font-size:11px}
.op{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:0 6px;white-space:nowrap}
.op-up{background:var(--new-bg);color:var(--new)}
.op-now{background:#fdecd8;color:#a8571a}
.op-open{background:var(--chip);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .op-now{background:#3a2a17;color:#f0b072}}
.op-range{font-size:12px;color:var(--muted);white-space:nowrap}
.detail td{background:var(--row-hover);cursor:default}
.detail .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 18px}
.detail dt{color:var(--muted);font-size:12px}.detail dd{margin:0 0 4px}
.detail textarea{width:100%;min-height:54px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.m-only{display:none}
.i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font:600 10px/1 Georgia,serif;font-style:italic;cursor:help;margin-left:4px;vertical-align:1px;flex:none}
.i:hover{border-color:var(--accent);color:var(--accent)}
#tip{position:fixed;z-index:50;max-width:320px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.18);display:none;white-space:pre-line}
.ms{position:relative}
.ms>button{display:flex;align-items:center;gap:4px;white-space:nowrap}
.ms>button.act{border-color:var(--accent);color:var(--accent);font-weight:600}
.ms .pan{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:8px;min-width:270px;max-height:420px;overflow:auto}
.ms.open .pan{display:block}
.pan label{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.pan label:hover{background:var(--row-hover)}
.pan .n{margin-left:auto;padding-left:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pan .top{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:12px;color:var(--muted)}
.pan .top button{padding:2px 7px;font-size:12px}
.pan .seg button{padding:2px 8px;font-size:12px}
.views{display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:1400px;margin:0 auto;padding:0 16px 10px}
.views .vw{font-size:12px;padding:3px 10px;border-radius:999px}
.views .vw.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.views .vw .x{margin-left:6px;opacity:.6}
.views .lbl{font-size:12px;color:var(--muted)}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--accent)}
.more{display:block;margin:14px auto}
.more[hidden]{display:none}
footer{max-width:1400px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
footer table{font-size:12px}
@media (max-width:760px){
  thead{display:none}
  .m-only{display:inline-block}
  .controls{position:static}
  tbody tr.lead td{grid-column:2}
  tbody tr.lead td.c-score{grid-column:1;grid-row:1 / span 4}
  table,tbody,tr,td{display:block;width:100%}
  table{border:0;background:transparent}
  tbody tr.lead{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  tbody tr.lead td{border:0;padding:0}
  tbody tr.lead td.c-hide{display:none}
  tbody tr.detail{border:1px solid var(--line);border-radius:10px;margin:-6px 0 8px}
  tbody tr.detail td{border:0}
  footer table, footer tbody, footer tr, footer td{display:revert}
}
</style>
</head>
<body>
<header>
  <h1>☕ Coffee shop openings</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="stats" id="stats"></div>
</header>
<div class="controls"><div class="controls-in">
  <input type="search" id="q" placeholder="Search name, owner, address, city, zip, @handle…" autocomplete="off">
  <div class="seg" id="since">
    <button data-v="1">New today</button><button data-v="7">7d</button><button data-v="30">30d</button><button data-v="0" class="on">All</button>
  </div><span class="i" data-tip="since">i</span>
  <div class="ms" id="f-opening"></div>
  <div class="ms" id="f-ltype"></div>
  <div class="ms" id="f-contact"></div>
  <div class="ms" id="f-signal"></div>
  <div class="ms" id="f-state"></div>
  <div class="ms" id="f-status"></div>
  <label class="chk"><input type="checkbox" id="hideChains" checked> Hide chains<span class="i" data-tip="hideChains">i</span></label>
  <label class="chk">Min score <input type="number" id="minScore" value="0" min="0" max="100" step="5" style="width:64px"><span class="i" data-tip="score">i</span></label>
  <select id="sortSel" class="m-only" title="Sort">
    <option value="score:-1">Sort: score</option><option value="open_est_start:1">Sort: soonest opening</option><option value="first_event_date:-1">Sort: newest event</option>
    <option value="first_seen:-1">Sort: newest found</option><option value="name:1">Sort: name</option><option value="city:1">Sort: city</option>
  </select>
  <button id="csv" title="Downloads exactly the leads you're looking at, for example to upload to Clay">Download CSV</button>
</div>
<div class="views" id="views"></div></div>
<div id="tip"></div>
<main>
  <div class="count" id="count"></div>
  <table id="tbl"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  <button class="more" id="more" hidden>Show more</button>
</main>
<footer id="foot"></footer>
<script>
const SIGNALS = {
  pre_opening_inspection:"Pre-opening inspection", new_food_permit:"New food permit",
  plan_review:"Plan review", building_permit:"Building permit",
  new_business_license:"New business license", business_registration:"State registration",
  inspection:"First inspection", coming_soon:"Coming soon (Instagram / Facebook / news)"};
const STATUSES = ["new","researching","contacted","demo booked","won","not a fit"];
const COLUMNS = [
  {k:"score", t:"Score", num:true, cls:"c-score"},
  {k:"name", t:"Shop"},
  {k:"city", t:"Location"},
  {k:"owner", t:"Owner & contact", cls:"c-hide"},
  {k:"open_est_start", t:"Opening (est.)", num:true},
  {k:"first_event_date", t:"Event date", num:true, cls:"c-hide"},
  {k:"signals", t:"Signals", cls:"c-hide"},
  {k:"first_seen", t:"Found", num:true, cls:"c-hide"},
  {k:"status", t:"Status"},
];
const PAGE = 200;
let DATA = [], META = {}, view = [], shown = PAGE, open = null;
let sort = {k:"score", dir:-1};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Status + notes are kept in this browser only.
function store(){ try { return JSON.parse(localStorage.getItem("leadNotes")||"{}"); } catch { return {}; } }
let NOTES = store();
function saveNotes(){ try { localStorage.setItem("leadNotes", JSON.stringify(NOTES)); } catch {} }
const statusOf = l => (NOTES[l.lead_key]||{}).status || "new";
const notesOf = l => (NOTES[l.lead_key]||{}).notes || "";

function scoreColor(s){ return s>=80?"var(--hot)":s>=60?"var(--warm)":"var(--cool)"; }
function fmtPhone(p){ p=String(p||"").replace(/\D/g,""); if(p.length===11&&p[0]==="1")p=p.slice(1);
  return p.length===10?`(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`:p; }
function daysAgo(iso){ return (Date.now()-new Date(iso.length<=19?iso+"Z":iso))/864e5; }
const latestSeen = () => DATA.reduce((m,l)=>l.first_seen>m?l.first_seen:m,"");

function sinceCut(days){
  if(!days) return "";
  // "New today" = rows added by the latest daily run; Nd = first seen within N days of the latest run.
  const last = new Date((latestSeen()||"").slice(0,10)+"T00:00:00Z");
  if (days===1) return latestSeen().slice(0,10);
  return new Date(last - (days-1)*864e5).toISOString().slice(0,10);
}

// ---------- Info text for the (i) boxes ----------
const TIP = {
  since: "When the tool first found this shop (not the date on the record).\nNew today = added by the latest daily run.",
  score: "0 to 100. Adds up:\n- How clearly it's coffee (name says coffee/espresso/cafe ranks highest)\n- The strongest signal (pre-opening inspection 40, food permit 35, plan review 35, building permit 25, business license 25, coming soon post 25, state filing 15, routine inspection 10)\n- +10 if two or more kinds of records agree\n- Recency (+20 if within 30 days, +12 within 90, +5 within 180)\n- +3 if a phone number is on file\n- Minus 45 for chains, minus 35 if proven already open, minus 15 if probably already open",
  hideChains: "Hides known chains and franchises (Starbucks, Dunkin, 7 Brew, Scooter's, etc.) and any brand opening 4 or more new storefronts on the list.",
  opening: "Estimated from the kind of record and its date. Each record type has a typical lead time (hover each option). The tool picks the most precise record the shop has.",
  ltype: "Is this really a new shop? Checked against earlier inspections at the same address under the same name (NYC, Chicago), review counts found online, Google (if set up) and OpenStreetMap. A different business at the same address (like a closed IHOP) does NOT count against a shop.",
  contact: "What we already know about the owner and how to reach them.\nAny = at least one checked item. All = every checked item.\nFor Clay: owner name + website or Instagram gives Clay the most to work with.",
  signal: "Which public records or posts put this shop on the list.\nAny = has at least one checked signal. All = has every checked signal (good for testing combinations).",
  state: "State of the shop's address.",
  status: "Your own status for the lead. Saved in this browser only.",
  views: "A view saves every filter, the search box and the sort. Saved views live in this browser. The page link also updates as you filter, so you can bookmark it or send it to someone."
};
const OPT_TIP = {
  opening: {
    "Upcoming": "Today is before the estimated opening window starts. The shop hasn't opened yet.",
    "Opening now": "Today falls inside the estimated opening window. Best time to reach out.",
    "Probably open": "The estimated window has passed. The shop has likely opened, possibly recently.",
    "Already open": "Evidence the shop was already trading: same business name inspected at this address more than 90 days before, 60+ online reviews, or Google lists it open with 10+ reviews.",
    "(no estimate)": "No record with a usable date."},
  ltype: {
    "New business": "No sign of an earlier shop with this name. The best prospects.",
    "New location of existing brand": "The name already has other storefronts (an existing independent opening another location).",
    "Existing shop (new permit or owner)": "Same business seen here before. Usually a renewal, remodel or change of owner rather than an opening.",
    "Already open": "Proven open before the record that put it on the list (see Opening info).",
    "Chain / franchise": "Known chain or franchise."},
  contact: {
    owner: "A person's name. From permit or business filings (often an officer or registered agent, so double-check), found online, or found by looking up the phone number from the permit ('listed with this phone number', worth confirming).",
    web_owner: "Owner or founder named in news, LinkedIn or the shop's own website, with a link to where it was found. Usually the real operator.",
    phone: "Phone number from the permit, inspection or license record (most come from NYC health inspections) or OpenStreetMap. Often the applicant's own cell. When no owner is found by name, the tool searches this number to find who it's listed under.",
    instagram: "Instagram handle. From OpenStreetMap, the shop's website or web search.",
    facebook: "Facebook page found in web search results.",
    website: "The shop's own website.",
    email: "Email address found on the shop's website or in records.",
    no_owner: "No owner name found yet (from any source).",
    none: "No owner, phone, Instagram, Facebook, website or email yet."},
  signal: {
    pre_opening_inspection: "Health department inspection required before a food business may open. Usually 0 to 6 weeks before opening. Strongest signal. (NYC, Chicago, Montgomery County MD)",
    new_food_permit: "New food service permit issued. Usually right around opening, within about a month. (Austin, Cincinnati, Raleigh area, Seattle area, NY State)",
    plan_review: "Health department reviews the kitchen and floor plans. Usually 2 to 5 months before opening.",
    building_permit: "Build-out or renovation permit mentioning coffee, cafe, espresso, boba or matcha. Usually 2 to 6 months before opening. (Chicago)",
    new_business_license: "City business license issued. Usually from 2 weeks before to 6 weeks after opening. (15 cities)",
    business_registration: "New LLC or trade name filed with the state. Usually 3 to 9 months before opening, and some never open. Least precise.",
    inspection: "Routine health inspection, first one on record. Usually means the shop is already open.",
    coming_soon: "The shop announced 'coming soon' on Instagram, Facebook, TikTok or in local news. Most open within 1 to 4 months. If the post names a month, that month is used."}
};

// ---------- Multi-select filters ----------
const isOld = l => ["Already open","Existing shop (new permit or owner)"].includes(l.lead_type);
const CONTACT = {owner:"Owner name", web_owner:"Owner found online", phone:"Phone", instagram:"Instagram",
  facebook:"Facebook", website:"Website", email:"Email", no_owner:"No owner name yet", none:"Nothing yet"};
const hasC = (l,k) => k==="phone" ? !!phoneOf(l) : k==="no_owner" ? !l.owner : k==="none" ? !(l.owner||phoneOf(l)||l.instagram||l.facebook||l.website||l.email) : !!l[k];
const FILTERS = {
  opening: {label:"Opening", opts:()=>["Upcoming","Opening now","Probably open","Already open","(no estimate)"],
    test:(l,v)=> v==="(no estimate)" ? !l.open_status : l.open_status===v},
  ltype: {label:"Type", opts:()=>["New business","New location of existing brand","Existing shop (new permit or owner)","Already open","Chain / franchise"]
      .filter(v=>v==="New business"||DATA.some(l=>l.lead_type===v)),
    test:(l,v)=> (l.lead_type||"New business")===v, def:["New business","New location of existing brand"]},
  contact: {label:"Contact info", mode:true, opts:()=>Object.keys(CONTACT), name:k=>CONTACT[k], test:hasC},
  signal: {label:"Signals", mode:true, opts:()=>Object.keys(SIGNALS).filter(s=>DATA.some(l=>l.signals.includes(s))),
    name:k=>SIGNALS[k], test:(l,v)=>l.signals.split(",").includes(v)},
  state: {label:"State", opts:()=>[...new Set(DATA.map(l=>l.state).filter(Boolean))].sort(), test:(l,v)=>l.state===v},
  status: {label:"My status", opts:()=>STATUSES, test:(l,v)=>statusOf(l)===v},
};
let SEL = {};   // {filterId: {v:[...], mode:"any"|"all"}}
function defaults(){ SEL={}; for(const [id,f] of Object.entries(FILTERS)) SEL[id]={v:[...(f.def||[])], mode:"any"}; }
defaults();
const passF = (l,id) => { const s=SEL[id], f=FILTERS[id]; if(!s.v.length) return true;
  return s.mode==="all" ? s.v.every(v=>f.test(l,v)) : s.v.some(v=>f.test(l,v)); };

function msLabel(id){ const f=FILTERS[id], s=SEL[id], nm=f.name||(v=>v);
  if(!s.v.length) return `${f.label}: any`;
  if(s.v.length===1) return `${f.label}: ${nm(s.v[0])}`;
  return `${f.label}: ${s.v.length} ${s.mode==="all"?"(all)":"selected"}`; }
function buildMS(id){
  const f=FILTERS[id], s=SEL[id], el=$("f-"+id), nm=f.name||(v=>v);
  const wasOpen = el.classList.contains("open");
  // counts: leads that pass every OTHER filter and also have this option
  const base = DATA.filter(l => passBase(l) && Object.keys(FILTERS).every(o=>o===id||passF(l,o)));
  const opts = f.opts().map(v=>{ const n=base.filter(l=>f.test(l,v)).length; const tip=OPT_TIP[id]?.[v];
    return `<label><input type="checkbox" value="${esc(v)}" ${s.v.includes(v)?"checked":""}>${esc(nm(v))}${tip?`<span class="i" data-otip="${id}|${esc(v)}">i</span>`:""}<span class="n">${n.toLocaleString()}</span></label>`; }).join("");
  const mode = f.mode ? `<span class="seg" data-mode><button data-m="any" class="${s.mode==="any"?"on":""}">Any</button><button data-m="all" class="${s.mode==="all"?"on":""}">All</button></span>` : "";
  el.innerHTML = `<button type="button" class="${s.v.length?"act":""}">${esc(msLabel(id))} ▾</button>
    <div class="pan"><div class="top"><span>${esc(f.label)}<span class="i" data-tip="${id}">i</span></span>${mode}<button type="button" data-clear>Clear</button></div>${opts}</div>`;
  el.classList.toggle("open", wasOpen);
}
function passBase(l){
  const q=$("q").value.trim().toLowerCase(), hide=$("hideChains").checked, min=+$("minScore").value||0;
  const cut=sinceCut(+document.querySelector("#since .on").dataset.v);
  return (!hide||!l.chain) && l.score>=min && (!cut||l.first_seen.slice(0,10)>=cut) && (!q||l._hay.includes(q));
}

function apply(){
  view = DATA.filter(l => passBase(l) && Object.keys(FILTERS).every(id=>passF(l,id)));
  const k=sort.k, d=sort.dir;
  view.sort((a,b)=>{ let x=k==="status"?statusOf(a):k==="open_est_start"?opKey(a):a[k], y=k==="status"?statusOf(b):k==="open_est_start"?opKey(b):b[k];
    if(typeof x==="number"&&typeof y==="number") return (x-y)*d || (b.score-a.score);
    x=String(x||""); y=String(y||""); if(!x&&y) return 1; if(x&&!y) return -1;
    return x.localeCompare(y)*d || (b.score-a.score); });
  Object.keys(FILTERS).forEach(buildMS);
  shown = PAGE; render(); renderViews(); saveHash();
}

// ---------- Views ----------
const PRESETS = [
  {name:"High confidence", builtin:true, tip:"Opening now or upcoming, new businesses and new locations only, with an owner name. Start here for Clay.",
   st:{sel:{opening:{v:["Upcoming","Opening now"],mode:"any"}, ltype:{v:["New business","New location of existing brand"],mode:"any"}, contact:{v:["owner"],mode:"any"}}, hideChains:true, minScore:0, since:"0", q:"", sort:{k:"open_est_start",dir:1}}},
  {name:"Opening soon, no owner yet", builtin:true, tip:"Opening now or upcoming new shops still missing an owner name. Candidates for manual research.",

function getState(){ return {sel:JSON.parse(JSON.stringify(SEL)), hideChains:$("hideChains").checked, minScore:+$("minScore").value||0,
  since:document.querySelector("#since .on").dataset.v, q:$("q").value, sort:{...sort}}; }
function setState(st){
  defaults();
  for(const [id,v] of Object.entries(st.sel||{})) if(SEL[id]) SEL[id]={v:[...(v.v||[])], mode:v.mode||"any"};
  if(st.sel && !st.sel.ltype && !("ltype" in st.sel)) SEL.ltype={v:[...FILTERS.ltype.def],mode:"any"};
  $("hideChains").checked = st.hideChains!==false; $("minScore").value = st.minScore||0; $("q").value = st.q||"";
  document.querySelectorAll("#since button").forEach(b=>b.classList.toggle("on", b.dataset.v===String(st.since||"0")));
  if(st.sort) sort={...st.sort};
  apply();
}
const sameState = (a,b) => JSON.stringify(norm(a))===JSON.stringify(norm(b));

  for(const id of Object.keys(FILTERS)){ const v=(s.sel||{})[id]||{v:id==="ltype"?FILTERS.ltype.def:[],mode:"any"}; sel[id]={v:[...v.v].sort(),mode:v.v.length?v.mode:"any"}; }
  return {sel, hideChains:s.hideChains!==false, minScore:+s.minScore||0, since:String(s.since||"0"), q:s.q||""}; }

function loadHash(){

const OP_CLS = {"Upcoming":"op-up","Opening now":"op-now","Probably open":"op-open","Already open":"op-open"};
const fmtD = iso => iso ? new Date(iso+"T12:00:00").toLocaleDateString([], {month:"short", day:"numeric"}) : "";
const yr = iso => iso ? iso.slice(0,4) : "";
function opRange(l){
  if(!l.open_est_start) return "";
  if(l.open_est_start===l.open_est_end) return `${fmtD(l.open_est_start)}, ${yr(l.open_est_start)}`;
  const y = yr(l.open_est_start)===yr(l.open_est_end) ? "" : ` ${yr(l.open_est_start)}`;
  return `${fmtD(l.open_est_start)}${y} – ${fmtD(l.open_est_end)}, ${yr(l.open_est_end)}`;
}
// Sort key for "soonest opening": opening now, then upcoming (soonest first), then probably open (most recent first).
const OP_RANK = {"Opening now":0,"Upcoming":1,"Probably open":2,"Already open":3};
function opKey(l){
  const r = OP_RANK[l.open_status]; if(r===undefined) return "";
  if(r<2) return `${r}${l.open_est_start}`;
  if(r===3) return "3";
  const days = Math.max(0, Math.round((Date.now()-new Date(l.open_est_end+"T12:00:00"))/864e5));
  return `2${String(days).padStart(6,"0")}`;
}
function openingCell(l){
  if(!l.open_status) return "";
  const low = l.open_conf==="low" ? ' <span class="conf">(rough)</span>' : "";
  const lt = l.lead_type && l.lead_type!=="New business" && l.lead_type!=="Chain / franchise" ? `<div class="conf">${esc(l.lead_type)}</div>` : "";
  const range = l.open_status==="Already open" ? "" : esc(opRange(l));
  return `<span class="op ${OP_CLS[l.open_status]||""}">${esc(l.open_status)}</span>${low}<div class="op-range">${range}</div>${lt}`;
}
const igUrl = h => `https://www.instagram.com/${encodeURIComponent(h)}/`;
const webUrl = w => /^https?:/i.test(w) ? w : "https://"+w;
const host = w => { try { return new URL(webUrl(w)).hostname.replace(/^www\./,""); } catch { return w; } };
const confTag = c => c==="medium" ? ' <span class="conf">(likely)</span>' : (c==="verified" ? ' <span class="conf">✓</span>' : "");
const stop = 'onclick="event.stopPropagation()" target="_blank" rel="noopener"';
const phoneOf = l => l.phone || l.osm_phone || "";
function contactCell(l){

  if (l.owner) bits.push(`<div class="who">${esc(l.owner)}${l.owner_role?` <span class="conf">${esc(l.owner_role)}</span>`:""}</div>`);

  if (l.instagram) links.push(`<a href="${igUrl(l.instagram)}" ${stop}>📷 @${esc(l.instagram)}</a>${confTag(l.instagram_conf)}`);

  if (links.length) bits.push(`<div>${links.join(" ")}</div>`);
  return bits.join("");
}

function stats(){
  const ind = DATA.filter(l=>!l.chain);
  const ls = latestSeen().slice(0,10);
  const fresh = DATA._multiDay ? DATA.filter(l=>l.first_seen.slice(0,10)===ls).length : 0;
  const hot = ind.filter(l=>l.score>=80).length;
  const states = new Set(DATA.map(l=>l.state).filter(Boolean)).size;
  const withOwner = ind.filter(l=>l.owner).length, withIg = ind.filter(l=>l.instagram).length;
  const hiConf = ind.filter(l=>["Upcoming","Opening now"].includes(l.open_status) && !isOld(l) && l.owner).length;
  $("stats").innerHTML = [
    [ind.length.toLocaleString(),"independent leads"],[hot.toLocaleString(),"score 80+"],
    [fresh.toLocaleString(),"new in last run"],[states,"states"],
    [withOwner.toLocaleString(),"with owner name"],[withIg.toLocaleString(),"with Instagram"],
    [hiConf.toLocaleString(),"high confidence ▸", "hc"]]
    .map(([b,s,c])=>`<div class="stat ${c?"click":""}" ${c?`id="${c}" title="${esc(PRESETS[0].tip)}"`:""}><b>${b}</b><span>${s}</span></div>`).join("");
  $("hc").onclick=()=>setState(PRESETS[0].st);
  const when = META.last_run ? new Date(META.last_run+"Z") : null;
  $("sub").innerHTML = `New coffee shops from city and state permit, license and inspection data. Refreshed daily${when?` · last run ${when.toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}`:""}.`;
  const runs = (META.runs||[]).map(r=>`<tr><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.jurisdiction||r.source_id)}</a>`:esc(r.source_id)}</td><td class="num">${r.fetched??""}</td><td class="num">${r.matched??""}</td><td>${r.error?"⚠️ "+esc(r.error.slice(0,120)):"ok"}</td></tr>`).join("");
  $("foot").innerHTML = `<p><b>Last run by source</b></p><table><thead><tr><th>Source</th><th>Fetched</th><th>Coffee</th><th>Status</th></tr></thead><tbody>${runs}</tbody></table>
   <p>Score 0–100: how clearly it's coffee + how close to opening the signal is + recency, minus 45 for chains. Opening (est.) is a date range estimated from the type of record and its date (for example, pre-opening inspections usually come 0 to 6 weeks before opening); "(rough)" means it's based on a state business registration, which is the least precise. Owner names come from the public permit and business filings (often an officer or registered agent, so double-check), or from the shop's website and web search, with a link to where each was found. Instagram, websites and emails come from OpenStreetMap, the shop's own website, web search or hand checks; "(likely)" means the handle matched the name but wasn't confirmed. "Really new?" checks whether a shop was already trading: earlier health inspections at the address under the same name (NYC, Chicago), review counts in web results, a Google listing (if set up) and OpenStreetMap. Shops proven to be already open are hidden by the default filter and lose 35 points. Status and notes are stored in this browser only; use Download CSV to keep them.</p>`;
}
